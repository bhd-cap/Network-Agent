<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetAgent Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6feb'/%3E%3Cpath d='M8 23V9l8 9V9m0 14l8-9v9' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form class="login-card" id="login-form">
      <div class="brand"><span class="logo">N</span><span>NetAgent</span></div>
      <p class="muted">Sign in with the admin token printed when the service starts
        (<code>netagent token</code>).</p>
      <label>Admin token
        <input type="password" id="login-token" autocomplete="current-password" required>
      </label>
      <div class="error" id="login-error" hidden></div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="logo">N</span><span>NetAgent</span></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="conn" class="conn"><span class="dot"></span><span id="conn-text">connecting</span></div>
        <button class="link" id="theme-toggle" type="button">Toggle theme</button>
        <button class="link" id="logout" type="button">Sign out</button>
        <div class="muted small" id="version"></div>
      </div>
    </aside>
    <main>
      <div id="demo-banner" class="banner" hidden>
        Demo mode: answers come from offline mock models and devices are simulated.
        Add real models under <a href="#/models">Models &amp; Ladders</a>.
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="/static/app.js"></script>
  <script src="/static/views.js"></script>
</body>
</html>
